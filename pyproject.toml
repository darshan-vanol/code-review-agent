[project]
name = "code-review-agent"
version = "0.1.0"
description = "Observable LangGraph code-review agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "langfuse>=4.12.0",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "ragas>=0.4.3",
    "langchain-groq>=1.1.3",
    "langchain-community>=0.3.0,<0.4.0",
    "fastembed>=0.8.0",
    "langchain-google-vertexai>=3.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
